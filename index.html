<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Monster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Catch the Monster</h1>
        <span id="theme"><i class="fa-solid fa-circle-half-stroke"></i>
</span>
    </header>
    <main>
        <div class="stats">
            <div class="points"><span id="points">0 </span><i class="fa-solid fa-star"></i></div>
            <div class="timer"><i class="fa-solid fa-hourglass"></i><span id="time"> 0</span></div>  
        </div>
        <div id="game-container">
            <p class="info" id="how-to-play">Click to pick up star. Gather as many as possible in 15 seconds!!!</p>
            <div id="monster"><i class="fa-solid fa-star"></i></div>
        </div>
        <button id="btn-start-game">Start</button>
        
    </main>
    <footer>
        <p>Michael Wolde ~ 2026</p>
    </footer>
</body>
</html>
